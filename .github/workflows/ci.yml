name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # next build imports the DB client but does not connect
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-build-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cemas
          POSTGRES_PASSWORD: cemas
          POSTGRES_DB: cemas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cemas -d cemas_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cemas:cemas@localhost:5432/cemas_ci
      AUTH_SECRET: ci-e2e-secret
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      # Seed admin account (src/shared/lib/seed.ts)
      E2E_EMAIL: admin@cemas.online
      E2E_PASSWORD: cemas2025!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:seed
      # Functional suites only (the 00-guide specs generate documentation screenshots)
      - run: pnpm exec playwright test e2e/0[1-9]
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
